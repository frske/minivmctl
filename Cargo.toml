[package]
name = "minivmctl"
version = "0.1.0"
edition = "2024"

[dependencies]
event-manager = { version = "0.4.2", features = ["remote_endpoint"] }
ini = { package = "rust-ini", version = "0.21.3" }
kvm-bindings = "0.14.0"
kvm-ioctls = "0.24.0"
libc = "0.2.186"
linux-loader = {git = "https://github.com/frske/linux-loader.git", branch = "topic/vm-memory-0.18"  }
netdev = "0.34.0"
iptables = "0.5.0"
nix = { version = "0.29.0", features = ["fs", "ioctl", "mount", "signal", "user"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rocket = { version = "0.5.1", features = ["json", "tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
virtio-bindings = { git = "https://github.com/rust-vmm/vm-virtio.git", branch = "main" }
virtio-blk = { git = "https://github.com/rust-vmm/vm-virtio.git", branch = "main", features = ["backend-stdio"] }
virtio-device = { git = "https://github.com/rust-vmm/vm-virtio.git", branch = "main" }
virtio-queue = { git = "https://github.com/rust-vmm/vm-virtio.git", branch = "main" }
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
vm-superio = "0.8.1"
vmm-sys-util = "0.15.0"
